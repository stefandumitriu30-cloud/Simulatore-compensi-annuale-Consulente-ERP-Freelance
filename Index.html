function t(key) {
  return I18N[currentLang][key];
}

function fmt(n) {
  const locale = currentLang === 'it' ? 'it-IT' : 'en-IE';
  return n.toLocaleString(locale, { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
}

function daysBetween(start, end) {
  const days = [];
  let d = new Date(start);
  const endD = new Date(end);
  while (d <= endD) {
    days.push(new Date(d));
    d.setDate(d.getDate() + 1);
  }
  return days;
}

function monthKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function monthLabel(key) {
  const [y, m] = key.split('-');
  return I18N[currentLang].months[parseInt(m, 10) - 1] + ' ' + y.slice(2);
}

function projectColor(index) {
  return PROJECT_COLORS[index % PROJECT_COLORS.length];
}

  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const key = el.getAttribute('data-i18n');
    const val = I18N[currentLang][key];
    if (typeof val === 'string') el.textContent = val;
  });
}

function calculate() {
  const coeff = Number(document.getElementById('coeff').value) || 0;
  const inpsRate = Number(document.getElementById('inps').value) || 0;
  const under5y = document.getElementById('under5y').checked;

  const months = {};

  projects.forEach((proj) => {
    if (!proj.startDate || !proj.endDate) return;
    const days = daysBetween(proj.startDate, proj.endDate);
    days.forEach((d) => {
      const iso = d.toISOString().slice(0, 10);
      const dow = d.getDay() === 0 ? 7 : d.getDay();
      const key = monthKey(d);
      if (!months[key]) months[key] = { billableDays: 0, revenue: 0, travelCost: 0, byProject: {} };
      if (!months[key].byProject[proj.id]) {
        months[key].byProject[proj.id] = { billableDays: 0, revenue: 0, travelCost: 0, onSiteDays: 0 };
      }
      const isWeekend = dow === 6 || dow === 7;
      const isHoliday = holidays.has(iso);
      if (!isWeekend && !isHoliday) {
        const rate = Number(proj.rate || 0);
        months[key].billableDays += 1;
        months[key].revenue += rate;
        months[key].byProject[proj.id].billableDays += 1;
        months[key].byProject[proj.id].revenue += rate;
        if ((proj.onSiteDays || []).includes(dow)) {
          months[key].byProject[proj.id].onSiteDays += 1;
        }
      }
    });
  });

  Object.values(months).forEach((m) => {
    let monthTravel = 0;
    Object.entries(m.byProject).forEach(([projId, pdata]) => {
      const proj = projects.find((p) => String(p.id) === String(projId));
      if (!proj) return;
      const dailyTravelCost = Number(proj.travelCostPerDay || 0);
      pdata.travelCost = pdata.onSiteDays * dailyTravelCost;
      monthTravel += pdata.travelCost;
    });
    m.travelCost = monthTravel;
  });

  const totalBillableDays = Object.values(months).reduce((s, m) => s + m.billableDays, 0);
  const totalRevenue = Object.values(months).reduce((s, m) => s + m.revenue, 0);
  const totalTravelCost = Object.values(months).reduce((s, m) => s + m.travelCost, 0);

  const coeffF = coeff / 100;
  const taxableIncome = totalRevenue * coeffF;
  const inps = taxableIncome * (inpsRate / 100);
  const imposta = under5y ? 0.05 : 0.15;
  const substituteTax = (taxableIncome - inps) * imposta;
  const totalTaxes = inps + substituteTax;
  const netTotal = totalRevenue - totalTaxes;
  const netCashAfterTravel = netTotal - totalTravelCost;

  const monthKeys = Object.keys(months).sort();
  const avgTaxRate = totalRevenue > 0 ? totalTaxes / totalRevenue : 0;
  const monthlyExpensesTotal = fixedExpenses.reduce((s, e) => s + Number(e.amount || 0), 0);

  const monthlyBreakdown = monthKeys.map((k) => {
    const m = months[k];
    const netRevenue = m.revenue * (1 - avgTaxRate);
    const netAfterTravel = netRevenue - m.travelCost;
    const occasionalForMonth = occasionalExpenses
      .filter((o) => o.month === k)
      .reduce((s, o) => s + Number(o.amount || 0), 0);
    const netAfterExpenses = netAfterTravel - monthlyExpensesTotal - occasionalForMonth;
    const activeProjectIds = Object.keys(m.byProject).filter((pid) => m.byProject[pid].billableDays > 0);
    const activeProjectNames = activeProjectIds.map((pid) => {
      const p = projects.find((x) => String(x.id) === String(pid));
      return p ? p.name : '—';
    });
    return {
      key: k, label: monthLabel(k),
      billableDays: m.billableDays,
      revenue: m.revenue, travelCost: m.travelCost,
      netRevenue, netAfterTravel, occasionalForMonth, netAfterExpenses,
      activeProjectNames,
    };
  });

  const avgMonthlyNet = monthlyBreakdown.length > 0
    ? monthlyBreakdown.reduce((s, m) => s + m.netAfterExpenses, 0) / monthlyBreakdown.length
    : 0;

  return {
    totalBillableDays, totalRevenue, taxableIncome, inps, substituteTax, totalTaxes,
    netTotal, totalTravelCost, netCashAfterTravel, monthlyBreakdown, monthKeys,
    monthlyExpensesTotal, avgMonthlyNet, months: monthKeys.length, coeff, inpsRate, under5y
  };
}

function renderProjects() {
  document.getElementById('projectsList').innerHTML = projects.map((proj, idx) => {
    const dayVals = [1, 2, 3, 4, 5];
    const dayButtons = dayVals.map((v, i) => `
      <button class="daybtn ${(proj.onSiteDays || []).includes(v) ? 'active' : ''}" data-day="${v}" type="button">${I18N[currentLang].days[i]}</button>
    `).join('');
    return `
      <div class="project-card" data-project-id="${proj.id}">
        <div class="project-header">
          <div style="display: flex; align-items: center;">
            <span class="project-swatch" style="background: ${projectColor(idx)};"></span>
            <input type="text" class="proj-name sans" value="${proj.name || ''}" placeholder="${t('newProject')}" style="font-size: 14px; font-weight: 500; border: none; background: transparent; padding: 4px 6px; width: 220px;">
          </div>
          <button class="btn danger proj-remove" type="button" ${projects.length <= 1 ? 'disabled' : ''}>${t('removeProject')}</button>
        </div>
        <div class="project-body">
          <div class="grid4" style="margin-bottom: 16px;">
            <div>
              <label>${t('erpLabel')}</label>
              <input type="text" class="proj-erp" value="${proj.erp || ''}" placeholder="${t('erpPlaceholder')}">
            </div>
            <div>
              <label>${t('rateLabel')}</label>
              <input type="number" class="proj-rate" value="${proj.rate != null ? proj.rate : ''}" placeholder="0">
            </div>
            <div>
              <label>${t('startLabel')}</label>
              <input type="date" class="proj-start" value="${proj.startDate || ''}">
            </div>
            <div>
              <label>${t('endLabel')}</label>
              <input type="date" class="proj-end" value="${proj.endDate || ''}">
            </div>
          </div>
          <div class="grid4b">
            <div>
              <label>${t('onSiteDaysLabel')}</label>
              <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;">
                ${dayButtons}
              </div>
            </div>
            <div>
              <label>${t('cityLabel')}</label>
              <input type="text" class="proj-city" value="${proj.city || ''}" placeholder="${t('cityPlaceholder')}">
            </div>
            <div>
              <label>${t('travelCostLabel')}</label>
              <input type="number" class="proj-travel-cost" value="${proj.travelCostPerDay != null ? proj.travelCostPerDay : ''}" placeholder="0">
            </div>
            <div></div>
          </div>
        </div>
      </div>
    `;
  }).join('');

  attachProjectListeners();
}

function attachProjectListeners() {
  document.querySelectorAll('.project-card').forEach((card) => {
    const id = Number(card.dataset.projectId);
    const proj = projects.find((p) => p.id === id);
    if (!proj) return;

    card.querySelector('.proj-name').addEventListener('input', (e) => {
      proj.name = e.target.value;
      recalcOnly();
    });
    card.querySelector('.proj-erp').addEventListener('input', (e) => {
      proj.erp = e.target.value;
      recalcOnly();
    });
    card.querySelector('.proj-rate').addEventListener('input', (e) => {
      proj.rate = e.target.value === '' ? null : Number(e.target.value);
      recalcOnly();
    });
    card.querySelector('.proj-start').addEventListener('change', (e) => {
      proj.startDate = e.target.value;
      renderOccasionalList();
      recalcOnly();
    });
    card.querySelector('.proj-end').addEventListener('change', (e) => {
      proj.endDate = e.target.value;
      renderOccasionalList();
      recalcOnly();
    });
    card.querySelector('.proj-city').addEventListener('input', (e) => {
      proj.city = e.target.value;
      recalcOnly();
    });
    card.querySelector('.proj-travel-cost').addEventListener('input', (e) => {
      proj.travelCostPerDay = e.target.value === '' ? null : Number(e.target.value);
      recalcOnly();
    });
    card.querySelectorAll('.daybtn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const day = Number(btn.dataset.day);
        proj.onSiteDays = proj.onSiteDays || [];
        if (proj.onSiteDays.includes(day)) {
          proj.onSiteDays = proj.onSiteDays.filter((d) => d !== day);
          btn.classList.remove('active');
        } else {
          proj.onSiteDays.push(day);
          proj.onSiteDays.sort();
          btn.classList.add('active');
        }
        recalcOnly();
      });
    });
    const removeBtn = card.querySelector('.proj-remove');
    if (removeBtn && projects.length > 1) {
      removeBtn.addEventListener('click', () => {
        projects = projects.filter((p) => p.id !== id);
        renderProjects();
        renderOccasionalList();
        recalcOnly();
      });
    }
  });
}

function recalcOnly() {
  const calc = calculate();
  const L = I18N[currentLang];

  document.getElementById('summaryCards').innerHTML = [
    { label: L.metricGrossRevenue, value: fmt(calc.totalRevenue), sub: L.metricGrossSub(calc.totalBillableDays, calc.months) },
    { label: L.metricTaxes, value: fmt(calc.totalTaxes), sub: L.metricTaxesSub(((calc.totalTaxes / calc.totalRevenue) * 100 || 0).toFixed(1)) },
    { label: L.metricNetTotal, value: fmt(calc.netTotal), sub: L.metricNetTotalSub },
    { label: L.metricAvgMonthly, value: fmt(calc.avgMonthlyNet), sub: L.metricAvgMonthlySub },
  ].map((c, i) => `
    <div class="metric ${i === 3 ? 'hi' : ''}">
      <div class="metric-label">${c.label}</div>
      <div class="metric-value">${c.value}</div>
      <div class="metric-sub">${c.sub}</div>
    </div>
  `).join('');

  document.getElementById('taxTable').innerHTML = `
    <tbody>
      <tr><td>${L.taxRowGross}</td><td>${fmt(calc.totalRevenue)}</td></tr>
      <tr><td>${L.taxRowTaxable(calc.coeff)}</td><td>${fmt(calc.taxableIncome)}</td></tr>
      <tr><td>${L.taxRowInps(calc.inpsRate)}</td><td>− ${fmt(calc.inps)}</td></tr>
      <tr><td>${L.taxRowSubstitute(calc.under5y ? '5' : '15')}</td><td>− ${fmt(calc.substituteTax)}</td></tr>
      <tr style="font-weight:700;"><td>${L.taxRowNetAfterTax}</td><td>${fmt(calc.netTotal)}</td></tr>
      <tr><td>${L.taxRowTravel}</td><td>− ${fmt(calc.totalTravelCost)}</td></tr>
      <tr style="font-weight:700; border-top:2px solid #e6e0d2;"><td>${L.taxRowNetCash}</td><td>${fmt(calc.netCashAfterTravel)}</td></tr>
    </tbody>
  `;

  // Historical method: current-year balance in June, next-year advance (100% of current taxes)
  // split 40% in June and 60% in November.
  const juneBalance = calc.totalTaxes;
  const juneAdvance = calc.totalTaxes * 0.40;
  const juneTotal = juneBalance + juneAdvance;
  const novemberAdvance = calc.totalTaxes * 0.60;
  const totalYear = juneTotal + novemberAdvance;

  document.getElementById('deadlinesTable').innerHTML = `
    <tbody>
      <tr><td>${L.deadlineJuneRow}</td><td>${fmt(juneBalance)}</td></tr>
      <tr><td>${L.deadlineJuneAdvanceRow}</td><td>${fmt(juneAdvance)}</td></tr>
      <tr style="font-weight:700; border-top:2px solid #e6e0d2;"><td>${L.deadlineJuneTotalRow}</td><td>${fmt(juneTotal)}</td></tr>
      <tr><td>${L.deadlineNovemberRow}</td><td>${fmt(novemberAdvance)}</td></tr>
      <tr style="font-weight:700; border-top:2px solid #e6e0d2;"><td>${L.deadlineTotalYearRow}</td><td>${fmt(totalYear)}</td></tr>
    </tbody>
  `;

  document.getElementById('expensesTotal').textContent = fmt(calc.monthlyExpensesTotal);

  document.getElementById('monthlyBody').innerHTML = calc.monthlyBreakdown.map((m) => `
    <tr>
      <td>${m.label}</td>
      <td class="sans" style="font-size: 11.5px; color: #6b6250; text-align:left;">${m.activeProjectNames.join(' / ') || '—'}</td>
      <td>${m.billableDays}</td>
      <td>${fmt(m.revenue)}</td>
      <td>− ${fmt(m.travelCost)}</td>
      <td>${fmt(m.netRevenue)}</td>
      <td>${fmt(m.netAfterTravel)}</td>
      <td>${m.occasionalForMonth > 0 ? '− ' + fmt(m.occasionalForMonth) : '-'}</td>
      <td style="font-weight:700; color:${m.netAfterExpenses >= 0 ? '#1c1a17' : '#a03d3d'};">${fmt(m.netAfterExpenses)}</td>
    </tr>
  `).join('') + monthlyTotalsRow(calc.monthlyBreakdown);

  renderRevenueByYear(calc);
}

function renderRevenueByYear(calc) {
  const byYear = {};
  calc.monthlyBreakdown.forEach((m) => {
    const year = m.key.split('-')[0];
    if (!byYear[year]) byYear[year] = { revenue: 0, taxes: 0, net: 0, months: 0, monthsCount: 0 };
    byYear[year].revenue += m.revenue;
    byYear[year].net += m.netAfterExpenses;
    byYear[year].monthsCount += 1;
  });

  const avgTaxRate = calc.totalRevenue > 0 ? calc.totalTaxes / calc.totalRevenue : 0;
  const years = Object.keys(byYear).sort();
  const L = I18N[currentLang];
  const container = document.getElementById('revenueByYearCards');

  if (years.length === 0) {
    container.innerHTML = `
      <div class="metric" style="grid-column: 1 / -1;">
        <div class="metric-sub">${L.noProjectsYet}</div>
      </div>
    `;
    return;
  }

  container.innerHTML = years.map((y) => {
    const data = byYear[y];
    const taxes = data.revenue * avgTaxRate;
    const avgMonthlyNet = data.monthsCount > 0 ? data.net / data.monthsCount : 0;
    return `
      <div class="metric">
        <div class="metric-label">${y}</div>
        <div class="metric-value">${fmt(data.revenue)}</div>
        <div class="metric-sub">${L.taxRowGross}</div>
      </div>
      <div class="metric">
        <div class="metric-label">${y}</div>
        <div class="metric-value">${fmt(taxes)}</div>
        <div class="metric-sub">${L.metricTaxes}</div>
      </div>
      <div class="metric">
        <div class="metric-label">${y}</div>
        <div class="metric-value">${fmt(data.net)}</div>
        <div class="metric-sub">${L.metricNetTotal}</div>
      </div>
      <div class="metric hi">
        <div class="metric-label">${y}</div>
        <div class="metric-value">${fmt(avgMonthlyNet)}</div>
        <div class="metric-sub">${L.metricAvgMonthly}</div>
      </div>
    `;
  }).join('');
}

function monthlyTotalsRow(rows) {
  const sum = (key) => rows.reduce((s, m) => s + m[key], 0);
  const totalBillableDays = sum('billableDays');
  const totalRevenue = sum('revenue');
  const totalTravelCost = sum('travelCost');
  const totalNetRevenue = sum('netRevenue');
  const totalNetAfterTravel = sum('netAfterTravel');
  const totalOccasional = sum('occasionalForMonth');
  const totalNetAfterExpenses = sum('netAfterExpenses');
  return `
    <tr style="font-weight:700; border-top:2px solid #e6e0d2;">
      <td>${t('monthlyTotalLabel')}</td>
      <td></td>
      <td>${totalBillableDays}</td>
      <td>${fmt(totalRevenue)}</td>
      <td>− ${fmt(totalTravelCost)}</td>
      <td>${fmt(totalNetRevenue)}</td>
      <td>${fmt(totalNetAfterTravel)}</td>
      <td>${totalOccasional > 0 ? '− ' + fmt(totalOccasional) : '-'}</td>
      <td style="color:${totalNetAfterExpenses >= 0 ? '#1c1a17' : '#a03d3d'};">${fmt(totalNetAfterExpenses)}</td>
    </tr>
  `;
}

function renderExpensesList() {
  document.getElementById('expensesList').innerHTML = fixedExpenses.map((e) => `
    <div class="expense-row" data-id="${e.id}">
      <input type="text" class="exp-label" value="${e.label}">
      <input type="number" class="exp-amount" value="${e.amount}">
      <button class="btn exp-remove" type="button">${currentLang === 'it' ? 'Rimuovi' : 'Remove'}</button>
    </div>
  `).join('');
  attachExpenseListeners();
}

function attachExpenseListeners() {
  document.querySelectorAll('.expense-row').forEach((row) => {
    const id = Number(row.dataset.id);
    row.querySelector('.exp-label').addEventListener('input', (e) => {
      const exp = fixedExpenses.find((x) => x.id === id);
      if (exp) exp.label = e.target.value;
      recalcOnly();
    });
    row.querySelector('.exp-amount').addEventListener('input', (e) => {
      const exp = fixedExpenses.find((x) => x.id === id);
      if (exp) exp.amount = Number(e.target.value);
      recalcOnly();
    });
    row.querySelector('.exp-remove').addEventListener('click', () => {
      fixedExpenses = fixedExpenses.filter((x) => x.id !== id);
      renderExpensesList();
      recalcOnly();
    });
  });
}

function renderOccasionalList() {
  const calc = calculate();
  const monthOptions = calc.monthKeys.map((k) => `<option value="${k}">${monthLabel(k)}</option>`).join('');

  if (occasionalExpenses.length === 0) {
    document.getElementById('occasionalList').innerHTML = `
      <p class="sans" style="font-size: 13px; color: #a39a86; margin: 0;">${t('occasionalEmpty')}</p>
    `;
    return;
  }

  document.getElementById('occasionalList').innerHTML = occasionalExpenses.map((o) => `
    <div class="occasional-row" data-id="${o.id}">
      <input type="text" class="occ-label" value="${o.label}">
      <select class="occ-month">${monthOptions}</select>
      <input type="number" class="occ-amount" value="${o.amount}">
      <button class="btn occ-remove" type="button">${currentLang === 'it' ? 'Rimuovi' : 'Remove'}</button>
    </div>
  `).join('');

  document.querySelectorAll('.occasional-row').forEach((row) => {
    const id = Number(row.dataset.id);
    const occ = occasionalExpenses.find((x) => x.id === id);
    const monthSelect = row.querySelector('.occ-month');
    if (occ) monthSelect.value = occ.month;

    row.querySelector('.occ-label').addEventListener('input', (e) => {
      if (occ) occ.label = e.target.value;
      recalcOnly();
    });
    monthSelect.addEventListener('change', (e) => {
      if (occ) occ.month = e.target.value;
      recalcOnly();
    });
    row.querySelector('.occ-amount').addEventListener('input', (e) => {
      if (occ) occ.amount = Number(e.target.value);
      recalcOnly();
    });
    row.querySelector('.occ-remove').addEventListener('click', () => {
      occasionalExpenses = occasionalExpenses.filter((x) => x.id !== id);
      renderOccasionalList();
      recalcOnly();
    });
  });
}

function setLanguage(lang) {
  currentLang = lang;
  document.getElementById('langIt').classList.toggle('active', lang === 'it');
  document.getElementById('langEn').classList.toggle('active', lang === 'en');
  applyStaticTranslations();
  renderProjects();
  renderExpensesList();
  renderOccasionalList();
  recalcOnly();
}

document.getElementById('langIt').addEventListener('click', () => setLanguage('it'));
document.getElementById('langEn').addEventListener('click', () => setLanguage('en'));

document.getElementById('addProjectBtn').addEventListener('click', () => {
  projects.push({
    id: Date.now(),
    name: '',
    erp: '',
    rate: null,
    startDate: '',
    endDate: '',
    onSiteDays: [],
    city: '',
    travelCostPerDay: null,
  });
  renderProjects();
  renderOccasionalList();
  recalcOnly();
});

['coeff', 'inps', 'under5y'].forEach((id) => {
  document.getElementById(id).addEventListener('input', recalcOnly);
  document.getElementById(id).addEventListener('change', recalcOnly);
});

document.getElementById('addExpenseBtn').addEventListener('click', () => {
  fixedExpenses.push({ id: Date.now(), label: currentLang === 'it' ? 'Nuova voce' : 'New item', amount: 0 });
  renderExpensesList();
  recalcOnly();
});

document.getElementById('addOccasionalBtn').addEventListener('click', () => {
  const calc = calculate();
  const defaultMonth = calc.monthKeys[0] || '';
  occasionalExpenses.push({ id: Date.now(), label: currentLang === 'it' ? 'Nuova spesa' : 'New expense', month: defaultMonth, amount: 0 });
  renderOccasionalList();
  recalcOnly();
});

applyStaticTranslations();
renderProjects();
renderExpensesList();
renderOccasionalList();
recalcOnly();
</script>
</body>
</html>
